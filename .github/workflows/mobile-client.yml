# Builds the guest mobile app (mobileclient/: Flutter) for Android.
# - every push to main and every pull request that touches the app: analyze + tests + APK as a downloadable artifact
# - manual run from the Actions tab
# Server address: repository variable CLIENT_API_BASE_URL (Settings → Variables), default https://zafiro.kz/api.
# Signing: secrets ANDROID_KEYSTORE_BASE64 (PKCS12 file in base64), ANDROID_KEYSTORE_PASSWORD and
# ANDROID_KEY_ALIAS. Without them the APK is signed with a fresh debug key that phones may refuse.
# A build of main is published as a GitHub release client-v<version> (not "latest": that is the agent).
name: Mobile client (Android)

on:
  push:
    branches: [main]
    paths:
      - 'mobileclient/**'
      - '.github/workflows/mobile-client.yml'
  pull_request:
    paths:
      - 'mobileclient/**'
      - '.github/workflows/mobile-client.yml'
  workflow_dispatch:

# Сторонние действия закреплены по хешу коммита: подменённый тег не попадёт в сборку.
permissions:
  contents: write

concurrency:
  group: mobile-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobileclient
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with a debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          API_BASE_URL: ${{ vars.CLIENT_API_BASE_URL || 'https://zafiro.kz/api' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: >
          flutter build apk --release
          --build-number=${{ github.run_number }}
          --dart-define=API_BASE_URL=$API_BASE_URL

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/zafiro-client-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zafiro-client-android-${{ github.run_number }}
          path: mobileclient/build/app/outputs/flutter-apk/zafiro-client-*.apk
          if-no-files-found: error
          retention-days: 30

      # A direct link that opens on a phone without a GitHub account (an artifact needs one and is a zip).
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: client-v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Zafiro (Android) 1.0.${{ github.run_number }}
          make_latest: 'false'
          files: mobileclient/build/app/outputs/flutter-apk/zafiro-client-*.apk
