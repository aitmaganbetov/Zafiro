# Builds and tests the Windows PC agent (WindowsAgent/: ZafiroAgent + Frontend UI + tests; WPF + WebView2, .NET 10).
# - every push to main and every pull request that touches the agent: build + downloadable artifact
# - tag agent-vX.Y.Z (e.g. `git tag agent-v1.0.0 && git push origin agent-v1.0.0`): GitHub Release with the zip
# - manual run from the Actions tab
name: Windows agent

on:
  push:
    branches: [main]
    tags: ['agent-v*']
    paths:
      - 'WindowsAgent/**'
      - '.github/workflows/windows-agent.yml'
  pull_request:
    paths:
      - 'WindowsAgent/**'
      - '.github/workflows/windows-agent.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-agent-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  SOLUTION: WindowsAgent/ZafiroAgent.slnx
  PROJECT: WindowsAgent/ZafiroAgent/ZafiroAgent.csproj

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/agent-v*') {
            $version = $env:GITHUB_REF_NAME.Substring('agent-v'.Length)
          } else {
            $version = "0.0.$env:GITHUB_RUN_NUMBER"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Tag must look like agent-v1.2.3, got $env:GITHUB_REF_NAME" }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Agent version $version"

      - name: Check UI files
        shell: pwsh
        run: |
          if (-not (Test-Path 'WindowsAgent/Frontend/index.html')) {
            throw "WindowsAgent/Frontend/index.html is missing: the agent window would show 'UI не найден'."
          }

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test ${{ env.SOLUTION }} -c Release --no-build --logger "console;verbosity=normal" --logger "trx;LogFileName=results.trx" --results-directory test-results

      # Job logs need a GitHub login; annotations are visible to everyone on the run page.
      - name: Report failed tests
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem test-results -Filter *.trx -Recurse | ForEach-Object {
            [xml]$trx = Get-Content $_.FullName
            $trx.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'Failed' } | ForEach-Object {
              $where = (($_.Output.ErrorInfo.StackTrace -split "`n") | Where-Object { $_ -match '\.cs:line' } | Select-Object -First 1)
              $message = (($_.Output.ErrorInfo.Message + ' @ ' + $where) -replace "`r?`n", ' ').Trim()
              if ($message.Length -gt 900) { $message = $message.Substring(0, 900) }
              Write-Host "::error title=$($_.testName)::$message"
            }
          }

      # Две сборки: полная (.NET внутри, работает на любом ПК) и маленькая (~2 МБ,
      # нужен установленный .NET Desktop Runtime 10; без него Windows сама предложит его скачать).
      - name: Publish
        shell: pwsh
        run: |
          $common = @('${{ env.PROJECT }}', '-c', 'Release', '-r', 'win-x64',
                      '-p:PublishSingleFile=true', '-p:IncludeNativeLibrariesForSelfExtract=true',
                      '-p:Version=${{ steps.version.outputs.version }}')
          dotnet publish @common --self-contained true -p:EnableCompressionInSingleFile=true -o publish/full
          dotnet publish @common --self-contained false -o publish/small

      - name: Package
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          foreach ($kind in 'full', 'small') {
            if (-not (Test-Path "publish/$kind/Frontend/index.html")) { throw "Frontend was not copied into the $kind build" }
            $name = if ($kind -eq 'full') { "ZafiroAgent-win-x64-$version" } else { "ZafiroAgent-win-x64-$version-small" }
            Compress-Archive -Path "publish/$kind/*" -DestinationPath "$name.zip"
            $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
            "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
            $exe = (Get-Item "publish/$kind/ZafiroAgent.exe").Length / 1MB
            Write-Host ("{0}: exe {1:N1} MB, zip {2:N1} MB" -f $kind, $exe, ((Get-Item "$name.zip").Length / 1MB))
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ZafiroAgent-win-x64-${{ steps.version.outputs.version }}
          path: |
            ZafiroAgent-win-x64-*.zip
            ZafiroAgent-win-x64-*.zip.sha256
          retention-days: 30
          compression-level: 0 # zip уже сжат
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/agent-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ZafiroAgent-win-x64-${{ needs.build.outputs.version }}

      - uses: softprops/action-gh-release@v2
        with:
          name: Zafiro Agent ${{ needs.build.outputs.version }}
          files: |
            ZafiroAgent-win-x64-*.zip
            ZafiroAgent-win-x64-*.zip.sha256
          generate_release_notes: true
