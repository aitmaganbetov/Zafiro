# Builds and tests the Windows PC agent (WindowsAgent/: ZafiroAgent + Frontend UI + tests; WPF + WebView2, .NET 10).
# - every push to main and every pull request that touches the agent: build + downloadable artifact (zip)
# - push to main and tag agent-vX.Y.Z (e.g. `git tag agent-v1.0.0 && git push origin agent-v1.0.0`):
#   GitHub Release with the installer as a separate file (zip archives stay in the build artifact)
# - manual run from the Actions tab
name: Windows agent

on:
  push:
    branches: [main]
    tags: ['agent-v*']
    paths:
      - 'WindowsAgent/**'
      - '.github/workflows/windows-agent.yml'
  pull_request:
    paths:
      - 'WindowsAgent/**'
      - '.github/workflows/windows-agent.yml'
  workflow_dispatch:

# Сторонние действия закреплены по хешу коммита: подменённый тег не попадёт в сборку агента.
permissions:
  contents: read

concurrency:
  group: windows-agent-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  SOLUTION: WindowsAgent/ZafiroAgent.slnx
  PROJECT: WindowsAgent/ZafiroAgent/ZafiroAgent.csproj

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/agent-v*') {
            $version = $env:GITHUB_REF_NAME.Substring('agent-v'.Length)
          } else {
            $version = "0.0.$env:GITHUB_RUN_NUMBER"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Tag must look like agent-v1.2.3, got $env:GITHUB_REF_NAME" }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Agent version $version"

      - name: Check UI files
        shell: pwsh
        run: |
          if (-not (Test-Path 'WindowsAgent/Frontend/index.html')) {
            throw "WindowsAgent/Frontend/index.html is missing: the agent window would show 'UI не найден'."
          }

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test ${{ env.SOLUTION }} -c Release --no-build --logger "console;verbosity=normal" --logger "trx;LogFileName=results.trx" --results-directory test-results

      # Job logs need a GitHub login; annotations are visible to everyone on the run page.
      - name: Report failed tests
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem test-results -Filter *.trx -Recurse | ForEach-Object {
            [xml]$trx = Get-Content $_.FullName
            $trx.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'Failed' } | ForEach-Object {
              $where = (($_.Output.ErrorInfo.StackTrace -split "`n") | Where-Object { $_ -match '\.cs:line' } | Select-Object -First 1)
              $message = (($_.Output.ErrorInfo.Message + ' @ ' + $where) -replace "`r?`n", ' ').Trim()
              if ($message.Length -gt 900) { $message = $message.Substring(0, 900) }
              Write-Host "::error title=$($_.testName)::$message"
            }
          }

      # Две сборки: полная (.NET внутри, работает на любом ПК) и маленькая (~2 МБ,
      # нужен установленный .NET Desktop Runtime 10; без него Windows сама предложит его скачать).
      # Нативные DLL лежат рядом с exe, а не распаковываются во временную папку: служба работает
      # от SYSTEM, и подложенная клиентом в TEMP библиотека загрузилась бы с её правами.
      - name: Publish
        shell: pwsh
        run: |
          $common = @('${{ env.PROJECT }}', '-c', 'Release', '-r', 'win-x64',
                      '-p:PublishSingleFile=true', '-p:IncludeNativeLibrariesForSelfExtract=false',
                      '-p:Version=${{ steps.version.outputs.version }}')
          dotnet publish @common --self-contained true -p:EnableCompressionInSingleFile=true -o publish/full
          dotnet publish @common --self-contained false -o publish/small

      - name: Package
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          foreach ($kind in 'full', 'small') {
            if (-not (Test-Path "publish/$kind/Frontend/index.html")) { throw "Frontend was not copied into the $kind build" }
            Copy-Item WindowsAgent/tools/Protect-ClubPc.ps1 "publish/$kind/"
            $name = if ($kind -eq 'full') { "ZafiroAgent-win-x64-$version" } else { "ZafiroAgent-win-x64-$version-small" }
            Compress-Archive -Path "publish/$kind/*" -DestinationPath "$name.zip"
            $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
            "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
            $exe = (Get-Item "publish/$kind/ZafiroAgent.exe").Length / 1MB
            Write-Host ("{0}: exe {1:N1} MB, zip {2:N1} MB" -f $kind, $exe, ((Get-Item "$name.zip").Length / 1MB))
          }

      # Установщик для клубов: агент в Program Files + служба Windows (хранит токен ПК, перезапускает агент).
      - name: Installer
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          # Inno Setup 6 из образа runner; точная версия пишется в журнал сборки (в ISCC.exe её нет,
          # она есть в записи об установке).
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup 6 was not found' }
          $setupKey = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1'
          $innoVersion = (Get-ItemProperty $setupKey -ErrorAction SilentlyContinue).DisplayVersion
          Write-Host "Inno Setup $innoVersion"
          & $iscc /Qp "/DAppVersion=$version" "/DSourceDir=$PWD\publish\full" WindowsAgent/installer/ZafiroAgent.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          $name = "ZafiroAgentSetup-$version.exe"
          Move-Item "WindowsAgent/installer/$name" .
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -Encoding ascii "$name.sha256"
          Write-Host ("installer: {0:N1} MB" -f ((Get-Item $name).Length / 1MB))

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ZafiroAgent-win-x64-${{ steps.version.outputs.version }}
          path: |
            ZafiroAgent-win-x64-*.zip
            ZafiroAgent-win-x64-*.zip.sha256
            ZafiroAgentSetup-*.exe
            ZafiroAgentSetup-*.exe.sha256
          retention-days: 30
          compression-level: 0 # zip уже сжат
          if-no-files-found: error

  # Установщик — отдельным файлом (артефакты Actions скачиваются только zip-архивом). Каждая сборка
  # main и тег agent-vX.Y.Z дают релиз; постоянная ссылка на последний установщик:
  # https://github.com/aitmaganbetov/Zafiro/releases/latest/download/ZafiroAgentSetup.exe
  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/agent-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ZafiroAgent-win-x64-${{ needs.build.outputs.version }}

      - name: Installer without version in the name
        run: |
          version='${{ needs.build.outputs.version }}'
          cp "ZafiroAgentSetup-$version.exe" ZafiroAgentSetup.exe
          sha256sum ZafiroAgentSetup.exe > ZafiroAgentSetup.exe.sha256

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: agent-v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Zafiro Agent ${{ needs.build.outputs.version }}
          make_latest: 'true'
          files: |
            ZafiroAgentSetup.exe
            ZafiroAgentSetup.exe.sha256
            ZafiroAgentSetup-*.exe
            ZafiroAgentSetup-*.exe.sha256
          generate_release_notes: true
